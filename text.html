<!DOCTYPE html>
<html>
<head>
<title>Teks Berjalan Kiri ke Kanan</title>
<style>
.teks-berjalan {
  width: 100%;
  overflow: hidden;
  white-space: nowrap;
}
.teks {
  display: inline-block;
  padding-right: 100%; /* Mulai dari luar layar kiri */
  animation: jalan-balik 15s linear infinite; /* Animasi 15 detik, linear, berulang */
}

@keyframes jalan-balik {
  0% { transform: translateX(-100%); } /* Mulai dari kiri luar layar */
  50% { transform: translateX(0%); }    /* Bergerak ke posisi awal */
  100% { transform: translateX(-100%); } /* Kembali ke kiri luar layar */
}
</style>
</head>
<body>

<div class="teks-berjalan">
  <span class="teks">Ini adalah contoh teks yang berjalan dari kiri ke kanan dan kembali lagi. Selamat mencoba!</span>
</div>

</body>
</html>
